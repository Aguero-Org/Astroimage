apiVersion: 1

datasources:
  - name: Prometheus
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: P8E80F9AEF21F6940
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: P214B5B846CF3925F
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          name: TraceID
          url: $${__value.raw}

  - name: Tempo
    uid: P214B5B846CF3925F
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogs:
        datasourceUid: P8E80F9AEF21F6940
        filterByTraceID: true
        tags:
          - tag: service.name
            mappedField: service_name
      search:
        enabled: true
