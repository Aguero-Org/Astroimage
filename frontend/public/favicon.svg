<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <mask id="corte-hex">
      <rect width="100%" height="100%" fill="white" />
      <!-- Bajamos el ancho a 6 y redondeamos esquinas para evitar los picos invisibles -->
      <polygon points="55,25 75,37 75,63 55,75 35,63 35,37" fill="none" stroke="black" stroke-width="6"/>
    </mask>
  </defs>

  <!-- Hexágono izquierdo (Fondo) -->
  <polygon points="45,25 65,37 65,63 45,75 25,63 25,37" fill="none" stroke="#2c0735" stroke-width="4" mask="url(#corte-hex)" />
  
  <!-- Núcleo central -->
  <polygon points="50,42 56,46 56,54 50,58 44,54 44,46" fill="#613dc1" />

  <!-- Hexágono derecho (Frente) -->
  <polygon points="55,25 75,37 75,63 55,75 35,63 35,37" fill="none" stroke="#613dc1" stroke-width="4"/>
</svg>
