name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "sonar-project.properties"
  pull_request:
    branches:
      - main
      - develop
      - "feature/*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "sonar-project.properties"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://astroimage:astroimage@localhost:5432/astroimage
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: astroimage-test
      MINIO_SECURE: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astroimage
          POSTGRES_PASSWORD: astroimage
          POSTGRES_DB: astroimage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astroimage -d astroimage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - name: Start MinIO
        working-directory: .
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address :9001
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          docker logs minio >&2
          exit 1
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
      - name: Export OpenAPI
        run: uv run astroimage openapi export
      - name: Check OpenAPI is up to date
        run: git diff --exit-code openapi.json
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate routes and API client
        run: pnpm generate:routes
      - name: Biome
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
      - name: Build
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Opt-in: set repository variable SONAR_ENABLED=true and secret SONAR_TOKEN.
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build scanner args
        id: sonar_args
        shell: bash
        run: |
          args=()
          if [[ -n "${{ vars.SONAR_ORGANIZATION }}" ]]; then
            args+=("-Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}")
          fi
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: ${{ steps.sonar_args.outputs.args }}

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
