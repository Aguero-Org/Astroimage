name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/*"
      - "chore/*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "sonar-project.properties"
      - "sonar/**"
  pull_request:
    branches:
      - main
      - develop
      - "feature/*"
      - "chore/*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "sonar-project.properties"
      - "sonar/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://astroimage:astroimage@localhost:5432/astroimage
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: astroimage-test
      MINIO_SECURE: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astroimage
          POSTGRES_PASSWORD: astroimage
          POSTGRES_DB: astroimage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astroimage -d astroimage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - name: Start object storage
        working-directory: .
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=minioadmin \
            -e RUSTFS_SECRET_KEY=minioadmin \
            rustfs/rustfs:1.0.0 /data
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Object storage did not become ready" >&2
          docker logs minio >&2
          exit 1
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
      - name: Export OpenAPI
        run: uv run astroimage openapi export
      - name: Check OpenAPI is up to date
        run: git diff --exit-code openapi.json
      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate routes and API client
        run: pnpm generate:routes
      - name: Biome
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
      - name: Build
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check report renderer
        run: python3 -m unittest discover -s sonar -p "test_*.py"

      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Normalize coverage paths for the monorepo
        run: python3 sonar/normalize-coverage.py

      - name: Scan with ephemeral SonarQube
        run: bash sonar/ci-scan.sh

      - name: Upload Sonar report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-report
          path: |
            sonar/reports/issues.json
            sonar/reports/issues.md
          if-no-files-found: ignore
