repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv run --directory backend lint-imports
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: openapi-export
        name: openapi export
        entry: uv run --directory backend astroimage openapi export
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: biome
        name: biome
        entry: pnpm --dir frontend exec biome check --write
        language: system
        pass_filenames: false
        files: ^frontend/
