sonar.projectKey=Astroimage
sonar.projectName=Astroimage
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src

sonar.test.inclusions=backend/tests/**/*,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx

sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/build/**,**/coverage/**,**/.scannerwork/**,**/__pycache__/**,backend/alembic/**,frontend/src/api/generated/**,frontend/src/routeTree.gen.ts,**/*.gen.ts,**/*.gen.tsx

sonar.coverage.exclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/test/**,frontend/src/api/generated/**,frontend/src/routeTree.gen.ts,frontend/src/main.tsx,frontend/src/vite-env.d.ts,**/*.gen.ts,**/*.gen.tsx

sonar.python.version=3.12,3.13
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.cpd.exclusions=frontend/src/api/generated/**,frontend/src/routeTree.gen.ts

sonar.issue.ignore.multicriteria=tailwind-css-at-rules
sonar.issue.ignore.multicriteria.tailwind-css-at-rules.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tailwind-css-at-rules.resourceKey=**/frontend/src/index.css
