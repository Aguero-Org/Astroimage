sonar.projectKey=Astroimage
sonar.projectName=Astroimage
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src

sonar.test.inclusions=backend/tests/**/*,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx

sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/build/**,**/coverage/**,**/.scannerwork/**,**/__pycache__/**,**/.cache/**,backend/alembic/**,frontend/src/api/generated/**,frontend/src/routeTree.gen.ts,**/*.gen.ts,**/*.gen.tsx

sonar.coverage.exclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,frontend/src/test/**,frontend/src/api/generated/**,frontend/src/routeTree.gen.ts,frontend/src/main.tsx,frontend/src/vite-env.d.ts,**/*.gen.ts,**/*.gen.tsx,frontend/src/components/ui/sidebar.tsx,frontend/src/components/ui/sheet.tsx,frontend/src/components/ui/separator.tsx

sonar.python.version=3.12,3.13
sonar.python.coverage.reportPaths=backend/coverage.xml

# tsconfig.json is a solution file (`files: []`). The program that
# includes frontend/src is tsconfig.app.json. The singular property
# is deprecated.
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Generated code, plus glossary data tables (entries-*.ts). entries.ts
# itself stays in duplication analysis because it contains logic.
sonar.cpd.exclusions=frontend/src/api/generated/**,frontend/src/routeTree.gen.ts,frontend/src/features/glossary/entries-*.ts

# Tailwind at-rules are valid for this stylesheet. One-rule exclusion
# instead of a copied quality profile.
sonar.issue.ignore.multicriteria=tailwind-css-at-rules
sonar.issue.ignore.multicriteria.tailwind-css-at-rules.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tailwind-css-at-rules.resourceKey=**/frontend/src/index.css

# Enforce the server's quality gate (built-in Sonar way, new code).
# Do not set sonar.python.ruff.reportPaths, sonar.python.mypy.reportPaths,
# or a Biome generic-issue import: Ruff, mypy, Biome, and tsc already
# gate those findings in CI, and Sonar cannot tune external rules.
sonar.qualitygate.wait=true
