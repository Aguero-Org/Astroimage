services:
  api:
    build:
      context: ./backend
    command: ["uvicorn", "astroimage.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://astroimage:astroimage@postgres:5432/astroimage
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
      LOG_LEVEL: info
      ENVIRONMENT: development
      OTLP_ENDPOINT: http://host.docker.internal:4318/v1/traces
      OTEL_SERVICE_NAME: astroimage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: astroimage
      MINIO_SECURE: "false"
    volumes:
      - ./backend:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_MOCKING: "false"
      DOCKER: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: astroimage
      POSTGRES_PASSWORD: astroimage
      POSTGRES_DB: astroimage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astroimage -d astroimage"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  api_venv:
  frontend_node_modules:
